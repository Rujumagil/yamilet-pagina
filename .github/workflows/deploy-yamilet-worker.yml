name: Deploy Academia Yamilet Worker

on:
  push:
    branches:
      - main
      - fix/yamilet-large-video-stream-v64
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'yamilet-perez-site-v2-verde-github/academia/**'
      - '.github/workflows/deploy-yamilet-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Wrangler
        run: npm install

      - name: Deploy Worker + Stream binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
