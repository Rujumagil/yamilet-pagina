name: Academia Yamilet release checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every production JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find "$base" -maxdepth 1 -type f -name '*.js' -print0)
          test "$count" -gt 0
          echo "Validated $count production JavaScript files."

      - name: Validate current v109 admin architecture
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          required=(
            index.html catalogo.html styles.css manifest.webmanifest offline.html sw.js
            app.js academy-shell-v21.js academy-navigation.js academy-dashboard.js academy-visuals-v91.css
            academy-mobile-home-v94.css academy-visual-path-fix-v92.js
            academy-mobile-hero-v95.css academy-mobile-continue-v96.css academy-mobile-lower-home-v97.css
            academy-mobile-courses-v98.css academy-mobile-course-interior-v99.css
            academy-mobile-library-v100.css academy-mobile-certificates-v101.css academy-mobile-calendar-v102.css
            academy-mobile-profile-support-v103.css academy-profile-support-fix-v103.js
            academy-mobile-evaluations-v104.css academy-assessment-mobile-v104.js
            academy-mobile-admin-v105.css academy-mobile-admin-agenda-evaluations-v106.css
            academy-mobile-admin-certificates-support-v107.css
            academy-courses.js academy-evaluations.js academy-library.js academy-calendar.js
            academy-certificates.js academy-profile.js academy-support.js academy-explore.js
            academy-admin.js academy-content-runtime-v80.js academy-students-runtime-v81.js
            academy-assessment-runtime-v82.js academy-assessment-review-v83.js
            academy-certificate-runtime-v84.js academy-agenda-admin-v85.js
            academy-support-admin-v86.js academy-operations-admin-v87.js
            academy-settings-admin-v88.js verificar.html verificar-certificado.js
          )
          for asset in "${required[@]}"; do test -s "$base/$asset" || { echo "Missing $asset" >&2; exit 1; }; done
          test -s "$base/admin/index.html"
          test -s yamilet-perez-site-v2-verde-github/assets/logo-yamilet.png
          grep -q 'name="academy-build" content="v109-admin-routing"' "$base/index.html"
          grep -q 'manifest.webmanifest?v=108' "$base/index.html"
          grep -q 'academy-hash-router-v70.js?v=108' "$base/index.html"
          grep -q 'academy-dashboard.js?v=108' "$base/index.html"
          grep -q 'academy-pwa-v57.js?v=109' "$base/index.html"
          grep -q 'CACHE_NAME = `${CACHE_PREFIX}v108`' "$base/sw.js"
          grep -q "library: 'library'" "$base/academy-hash-router-v70.js"
          grep -q "resources: 'library'" "$base/academy-hash-router-v70.js"
          grep -q "calendar: 'calendar'" "$base/academy-hash-router-v70.js"
          grep -q "agenda: 'calendar'" "$base/academy-hash-router-v70.js"
          grep -q '../imagenes-academia-yamilet-final/04-favicon.png' "$base/manifest.webmanifest"
          ! grep -q '../../imagenes-academia-yamilet-final' "$base/manifest.webmanifest"
          ! grep -q '../../imagenes-academia-yamilet-final' "$base/academy-dashboard.js"
          ! grep -q '../../imagenes-academia-yamilet-final' "$base/academy-visuals-v91.css"
          grep -q "target.hash = '#admin'" "$base/admin/index.html"
          ! grep -q 'admin-v34.js' "$base/admin/index.html"
          grep -q "const VERSION = '89.0.0'" "$base/academy-aula-clone-v69.js"
          grep -q "const VERSION = '89.0.0'" "$base/academy-profile.js"
          grep -q "academy-public-config" "$base/app.js"
          grep -q "workspaceSlug = 'yamilet-mes'" "$base/app.js"

          visual_dir='imagenes-academia-yamilet-final'
          visuals=(
            01-yamilet-logo-master.png 02-yamilet-isotipo.png 03-yamilet-logo-header.png 04-favicon.png
            05-academia-hero-desktop.webp 06-academia-hero-tablet.webp 07-academia-hero-mobile.webp
            08-yamilet-academia.webp 09-yamilet-academia-horizontal.webp 10-metodo-mes-cover.webp
            11-metodo-mes-cover-vertical.webp 12-metodo-mes-thumb.webp 13-continuar-aprendiendo.webp
            14-comunidad-acompanamiento.webp 15-recursos-descargables.webp 16-certificados.webp
            17-academia-fondo-claro.webp 18-avatar-alumno-generico.webp
          )
          for asset in "${visuals[@]}"; do test -s "$visual_dir/$asset" || { echo "Missing visual $asset" >&2; exit 1; }; done

      - name: Smoke test hash navigation and admin guards
        run: node .github/scripts/academia-navigation-smoke-v89.mjs

      - name: Block retired and obsolete runtime layers
        shell: bash
        run: |
          set -euo pipefail
          index='yamilet-perez-site-v2-verde-github/academia/index.html'
          ! grep -qE 'academy-appletv-v49|academy-dedicated-view-v51|academy-enrollment-v50|academia-yamilet-multipage-v40|academy-ag-parity-v20' "$index"
          ! grep -q 'academy-sales-admin.js' "$index"
          ! grep -q 'academy-assessment-review.js' "$index"
          ! grep -q 'academy-sales-admin.css' "$index"
          ! grep -q 'academy-assessment-review.css' "$index"
          ! grep -q 'characterData: true' yamilet-perez-site-v2-verde-github/academia/academy-aula-clone-v69.js

      - name: Validate linked local CSS and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          for page in "$base/index.html" "$base/catalogo.html" "$base/verificar.html"; do
            grep -oE '(src|href)="\./[^\"]+\.(js|css)(\?[^\"]*)?"' "$page" \
              | sed -E 's/^(src|href)="\.\/([^"?]+).*/\2/' \
              | sort -u \
              | while IFS= read -r asset; do
                  test -s "$base/$asset" || { echo "Missing linked asset in $page: $asset" >&2; exit 1; }
                  case "$asset" in *.js) node --check "$base/$asset" ;; esac
                done
          done

      - name: Validate lazy administrative assets
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          lazy=(
            content-admin-p15.js academy-content-cms-v80.js students-p16.js
            academy-assessment-admin.js academy-assessment-review-v83.js
            academy-certificate-admin-v84.js academy-agenda-admin-v85.js
            academy-support-admin-v86.js academy-operations-admin-v87.js
            academy-settings-admin-v88.js
          )
          for asset in "${lazy[@]}"; do
            test -s "$base/$asset"
            node --check "$base/$asset"
          done

      - name: Guard public client boundary
        shell: bash
        run: |
          set -euo pipefail
          pattern='service[_-]?role|serviceRoleKey'
          ! grep -RniE "$pattern" yamilet-perez-site-v2-verde-github/academia --include='*.html' --include='*.js'

  deploy-academia:
    name: Deploy Academia to gh-pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: academia-yamilet-production
      cancel-in-progress: true
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1

      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 1

      - name: Sync Academia and original visual assets
        shell: bash
        run: |
          set -euo pipefail
          source_dir='source/yamilet-perez-site-v2-verde-github/academia/'
          public_dir='public/academia/'
          visual_source='source/imagenes-academia-yamilet-final/'
          visual_public='public/imagenes-academia-yamilet-final/'
          test -d "$source_dir"
          test -d "$visual_source"
          mkdir -p "$public_dir" "$visual_public"
          rsync -a --delete --exclude='.git/' "$source_dir" "$public_dir"
          rsync -a --delete "$visual_source" "$visual_public"
          install -D -m 0644 source/yamilet-perez-site-v2-verde-github/assets/logo-yamilet.png public/assets/logo-yamilet.png

      - name: Verify synchronized v109 snapshot
        shell: bash
        run: |
          set -euo pipefail
          diff -qr source/yamilet-perez-site-v2-verde-github/academia public/academia
          diff -qr source/imagenes-academia-yamilet-final public/imagenes-academia-yamilet-final
          test -s public/academia/index.html
          test -s public/academia/catalogo.html
          test -s public/academia/sw.js
          test -s public/academia/manifest.webmanifest
          test -s public/academia/academy-visuals-v91.css
          test -s public/academia/academy-mobile-home-v94.css
          test -s public/academia/academy-mobile-admin-certificates-support-v107.css
          test -s public/assets/logo-yamilet.png
          test -s public/imagenes-academia-yamilet-final/05-academia-hero-desktop.webp
          test -s public/imagenes-academia-yamilet-final/07-academia-hero-mobile.webp
          test -s public/imagenes-academia-yamilet-final/17-academia-fondo-claro.webp
          grep -q 'name="academy-build" content="v109-admin-routing"' public/academia/index.html
          grep -q 'CACHE_NAME = `${CACHE_PREFIX}v108`' public/academia/sw.js
          grep -q "library: 'library'" public/academia/academy-hash-router-v70.js
          grep -q "calendar: 'calendar'" public/academia/academy-hash-router-v70.js
          grep -q '../imagenes-academia-yamilet-final/04-favicon.png' public/academia/manifest.webmanifest
          ! grep -q 'academy-sales-admin.js' public/academia/index.html
          ! grep -q 'academy-assessment-review.js' public/academia/index.html
          ! grep -q '../../imagenes-academia-yamilet-final' public/academia/manifest.webmanifest
          ! grep -q '../../imagenes-academia-yamilet-final' public/academia/academy-dashboard.js
          ! grep -q '../../imagenes-academia-yamilet-final' public/academia/academy-visuals-v91.css

      - name: Guard deployment scope
        shell: bash
        run: |
          set -euo pipefail
          cd public
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(academia/|imagenes-academia-yamilet-final/|assets/logo-yamilet\.png$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Deployment attempted to change files outside the Academy scope:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A academia imagenes-academia-yamilet-final assets/logo-yamilet.png
          if git diff --cached --quiet; then
            echo "gh-pages already matches validated main; nothing to publish."
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          git commit -m "deploy(academia): sync ${short_sha}" -m "Validated source: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
