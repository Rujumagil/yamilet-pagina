name: Academia Yamilet release checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production JavaScript
        run: |
          node --check yamilet-perez-site-v2-verde-github/academia/app.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-shell-v21.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-player-v37.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-progress-v58.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-pwa-v57.js
          node --check yamilet-perez-site-v2-verde-github/academia/sw.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-navigation.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-dashboard.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-courses.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-explore.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-public-catalog-v68.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-aula-clone-v69.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-module-navigation-v66.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-evaluations.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-library.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-calendar.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-certificates.js
          node --check yamilet-perez-site-v2-verde-github/academia/verificar-certificado.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-profile.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-support.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-admin.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-i18n-v27.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-i18n-preference-v27.js
          node --check yamilet-perez-site-v2-verde-github/academia/auth-email-p18.js
          node --check yamilet-perez-site-v2-verde-github/academia/private-media-p15.js
          node --check yamilet-perez-site-v2-verde-github/academia/drive-media-v26.js
          node --check yamilet-perez-site-v2-verde-github/academia/cloudflare-stream-v37.js
          node --check yamilet-perez-site-v2-verde-github/academia/recovery-p17.js

      - name: Validate architecture step 13 wiring
        run: |
          base='yamilet-perez-site-v2-verde-github/academia'
          test -s "$base/index.html"
          test -s "$base/catalogo.html"
          test -s "$base/styles.css"
          test -s yamilet-perez-site-v2-verde-github/assets/logo-yamilet.png
          test -s "$base/academy-admin.js"
          test -s "$base/academy-admin.css"
          test -s "$base/academy-progress-v58.js"
          test -s "$base/academy-progress-v58.css"
          test -s "$base/academy-pwa-v57.js"
          test -s "$base/academy-pwa-v57.css"
          test -s "$base/academy-course-hub-v68.css"
          test -s "$base/academy-public-catalog-v68.css"
          test -s "$base/academy-public-catalog-v68.js"
          test -s "$base/academy-aula-clone-v69.css"
          test -s "$base/academy-aula-clone-v69-user.css"
          test -s "$base/academy-aula-clone-v69.js"
          test -s "$base/manifest.webmanifest"
          test -s "$base/offline.html"
          test -s "$base/sw.js"
          test -s "$base/verificar.html"
          test -s "$base/verificar-certificado.js"
          test -s "$base/verificar-certificado.css"
          grep -q 'academia-yamilet-architecture-step-13' "$base/index.html"
          grep -q 'aula-compas-clone-v69' "$base/index.html"
          grep -q './app.js?v=66' "$base/index.html"
          grep -q './academy-navigation.js?v=68' "$base/index.html"
          grep -q './academy-dashboard.js?v=1' "$base/index.html"
          grep -q './academy-courses.js?v=68' "$base/index.html"
          grep -q './academy-course-hub-v68.css?v=68' "$base/index.html"
          grep -q './academy-aula-clone-v69.css?v=69' "$base/index.html"
          grep -q './academy-aula-clone-v69-user.css?v=69' "$base/index.html"
          grep -q './academy-aula-clone-v69.js?v=69' "$base/index.html"
          grep -q './academy-explore.js?v=68' "$base/index.html"
          grep -q './academy-evaluations.js?v=1' "$base/index.html"
          grep -q './academy-library.js?v=1' "$base/index.html"
          grep -q './academy-library.css?v=1' "$base/index.html"
          grep -q './academy-calendar.js?v=1' "$base/index.html"
          grep -q './academy-calendar.css?v=1' "$base/index.html"
          grep -q './academy-certificates.js?v=2' "$base/index.html"
          grep -q './academy-certificates.css?v=2' "$base/index.html"
          grep -q './academy-profile.js?v=1' "$base/index.html"
          grep -q './academy-profile.css?v=1' "$base/index.html"
          grep -q './academy-support.js?v=1' "$base/index.html"
          grep -q './academy-support.css?v=1' "$base/index.html"
          grep -q './academy-explore.css?v=1' "$base/index.html"
          grep -q './academy-admin.js?v=1' "$base/index.html"
          grep -q './academy-admin.css?v=1' "$base/index.html"
          grep -q './academy-player-v37.js?v=38' "$base/index.html"
          grep -q './academy-progress-v58.js?v=58' "$base/index.html"
          grep -q './academy-progress-v58.css?v=58' "$base/index.html"
          grep -q './academy-pwa-v57.js?v=57' "$base/index.html"
          grep -q './academy-pwa-v57.css?v=57' "$base/index.html"
          grep -q './manifest.webmanifest?v=57' "$base/index.html"
          grep -q './auth-email-p18.js?v=1' "$base/index.html"
          grep -q './private-media-p15.js?v=1' "$base/index.html"
          grep -q './drive-media-v26.js?v=26' "$base/index.html"
          grep -q './cloudflare-stream-v37.js?v=37' "$base/index.html"
          grep -q './recovery-p17.js?v=1' "$base/index.html"
          grep -q './academy-public-catalog-v68.js?v=68' "$base/catalogo.html"
          grep -q './academy-public-catalog-v68.css?v=68' "$base/catalogo.html"
          grep -q 'academia-yamilet-pwa-' "$base/sw.js"
          grep -q 'v69' "$base/sw.js"
          grep -q './verificar-certificado.js?v=1' "$base/verificar.html"
          grep -q './verificar-certificado.css?v=1' "$base/verificar.html"
          grep -q "academy-public-config" "$base/app.js"
          grep -q "workspaceSlug = 'yamilet-mes'" "$base/app.js"

      - name: Block obsolete runtime layers
        run: |
          ! grep -qE 'academy-appletv-v49|academy-dedicated-view-v51|academy-enrollment-v50|academia-yamilet-multipage-v40|academy-ag-parity-v20' yamilet-perez-site-v2-verde-github/academia/index.html

      - name: Validate linked local CSS and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          for index in "$base/index.html" "$base/catalogo.html"; do
            grep -oE '(src|href)="\./[^\"]+\.(js|css)(\?[^\"]*)?"' "$index" | sed -E 's/^(src|href)="\.\/([^"?]+).*/\2/' | sort -u | while IFS= read -r asset; do
              test -s "$base/$asset" || { echo "Missing or empty local asset referenced by $index: $asset" >&2; exit 1; }
              case "$asset" in
                *.js) node --check "$base/$asset" ;;
              esac
            done
          done

      - name: Guard public client boundary
        run: |
          pattern='service[_-]?role|serviceRoleKey'
          ! grep -RniE "$pattern" yamilet-perez-site-v2-verde-github/academia --include='*.html' --include='*.js'

  deploy-academia:
    name: Deploy Academia to gh-pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: academia-yamilet-production
      cancel-in-progress: true
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1

      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 1

      - name: Sync only Academia public files
        shell: bash
        run: |
          set -euo pipefail
          source_dir='source/yamilet-perez-site-v2-verde-github/academia/'
          public_dir='public/academia/'
          test -d "$source_dir"
          mkdir -p "$public_dir"
          rsync -a --delete --exclude='.git/' "$source_dir" "$public_dir"
          install -D -m 0644 source/yamilet-perez-site-v2-verde-github/assets/logo-yamilet.png public/assets/logo-yamilet.png

      - name: Verify synchronized snapshot
        shell: bash
        run: |
          set -euo pipefail
          diff -qr source/yamilet-perez-site-v2-verde-github/academia public/academia
          test -s public/academia/index.html
          test -s public/academia/catalogo.html
          test -s public/academia/sw.js
          test -s public/academia/manifest.webmanifest
          test -s public/assets/logo-yamilet.png
          grep -q 'aula-compas-clone-v69' public/academia/index.html
          grep -q './academy-aula-clone-v69.css?v=69' public/academia/index.html
          grep -q './academy-aula-clone-v69.js?v=69' public/academia/index.html
          grep -q './academy-courses.js?v=68' public/academia/index.html
          grep -q './academy-public-catalog-v68.js?v=68' public/academia/catalogo.html
          grep -q 'v69' public/academia/sw.js

      - name: Guard deployment scope
        shell: bash
        run: |
          set -euo pipefail
          cd public
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(academia/|assets/logo-yamilet\.png$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Deployment attempted to change files outside the Academy scope:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A academia assets/logo-yamilet.png
          if git diff --cached --quiet; then
            echo "gh-pages already matches validated main; nothing to publish."
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          git commit -m "deploy(academia): sync ${short_sha}" -m "Validated source: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
