name: Academia Yamilet release checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every production JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find "$base" -maxdepth 1 -type f -name '*.js' -print0)
          test "$count" -gt 0
          echo "Validated $count production JavaScript files."

      - name: Validate separated Academy V2 gateway
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          required=(
            index.html gateway.css gateway.js manifest.webmanifest sw.js offline.html catalogo.html
            registro/index.html registro/registro.css registro/registro.js
            v2/academy-v2.css v2/academy-v2.js
            inicio/index.html cursos/index.html cursos/metodo-mes/index.html
            cursos/metodo-mes/semana/index.html cursos/metodo-mes/leccion/index.html
            descubre/index.html biblioteca/index.html perfil/index.html
            admin/index.html
          )
          for asset in "${required[@]}"; do
            test -s "$base/$asset" || { echo "Missing $asset" >&2; exit 1; }
          done

          node --check "$base/gateway.js"
          node --check "$base/v2/academy-v2.js"

          grep -q 'name="deployment" content="academia-yamilet-v2-gateway"' "$base/index.html"
          grep -q 'name="academy-build" content="v143-registration-gateway"' "$base/index.html"
          grep -q 'gateway.css?v=143' "$base/index.html"
          grep -q 'gateway.js?v=143' "$base/index.html"
          grep -q 'manifest.webmanifest?build=143' "$base/index.html"

          ! grep -q 'academy-admin.js' "$base/index.html"
          ! grep -q 'academy-dashboard.js' "$base/index.html"
          ! grep -q 'academy-hash-router-v70.js' "$base/index.html"
          ! grep -q 'academy-aula-clone-v69.js' "$base/index.html"
          ! grep -q 'academy-mobile-admin' "$base/index.html"

          grep -q '"start_url": "./inicio/"' "$base/manifest.webmanifest"
          grep -q "const BUILD = params.get('build') || '143'" "$base/sw.js"
          grep -q "versioned('./gateway.js')" "$base/sw.js"
          grep -q "versioned('./v2/academy-v2.js')" "$base/sw.js"
          ! grep -q "versioned('./academy-dashboard.css')" "$base/sw.js"
          ! grep -q "versioned('./academy-shell-v21.css')" "$base/sw.js"

          grep -q "legacyAdminRedirect" "$base/gateway.js"
          grep -q "location.replace(ADMIN)" "$base/gateway.js"
          grep -q "sessionStorage.getItem('yamilet_academy_v2_next')" "$base/gateway.js"
          grep -q "capture_academy_registration_request" "$base/registro/registro.js"
          grep -q "resetPasswordForEmail" "$base/gateway.js"
          grep -q "signInWithPassword" "$base/gateway.js"
          grep -q '/academia/registro/' "$base/index.html"
          grep -q 'Gracias por inscribirte' "$base/registro/index.html"
          grep -q "emailRedirectTo:CONFIRM_REDIRECT" "$base/registro/registro.js"
          grep -q "/academia/?confirmed=1" "$base/registro/registro.js"
          grep -q 'data-confirmed-card' "$base/index.html"

          grep -q "location.replace('/admin/')" "$base/admin/index.html"

          visual_dir='imagenes-academia-yamilet-final'
          visuals=(01-yamilet-logo-master.png 02-yamilet-isotipo.png 03-yamilet-logo-header.png 04-favicon.png 10-metodo-mes-cover.webp)
          for asset in "${visuals[@]}"; do test -s "$visual_dir/$asset" || { echo "Missing visual $asset" >&2; exit 1; }; done

      - name: Smoke test separated routes
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          grep -q '/academia/inicio/' "$base/gateway.js"
          grep -q "const ADMIN='/admin/'" "$base/gateway.js"
          grep -q 'data-v2-page="home"' "$base/inicio/index.html"
          grep -q 'data-v2-page="courses"' "$base/cursos/index.html"
          grep -q 'data-v2-page="discover"' "$base/descubre/index.html"
          grep -q 'data-v2-page="library"' "$base/biblioteca/index.html"
          grep -q 'data-v2-page="profile"' "$base/perfil/index.html"

      - name: Validate multipage Academy V2
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          required_v2=(
            v2/academy-v2.css v2/academy-v2.js
            inicio/index.html cursos/index.html cursos/metodo-mes/index.html
            cursos/metodo-mes/semana/index.html cursos/metodo-mes/leccion/index.html
            descubre/index.html biblioteca/index.html perfil/index.html
          )
          for asset in "${required_v2[@]}"; do
            test -s "$base/$asset" || { echo "Missing Academy V2 asset: $asset" >&2; exit 1; }
          done
          node --check "$base/v2/academy-v2.js"
          grep -q 'data-v2-page="home"' "$base/inicio/index.html"
          grep -q 'data-v2-page="courses"' "$base/cursos/index.html"
          grep -q 'data-v2-page="course"' "$base/cursos/metodo-mes/index.html"
          grep -q 'data-v2-page="week"' "$base/cursos/metodo-mes/semana/index.html"
          grep -q 'data-v2-page="lesson"' "$base/cursos/metodo-mes/leccion/index.html"
          grep -q 'data-v2-page="discover"' "$base/descubre/index.html"
          grep -q 'data-v2-nav="discover"' "$base/inicio/index.html"
          grep -q 'academy-v2.js?v=7' "$base/inicio/index.html"
          grep -q 'academy-v2.css?v=7' "$base/inicio/index.html"
          grep -q 'academy-v2.js?v=7' "$base/descubre/index.html"
          grep -q 'academy-v2.css?v=7' "$base/descubre/index.html"
          grep -q 'personalizedPaymentUrl' "$base/v2/academy-v2.js"
          grep -Fq "data-v2-nav]').forEach" "$base/v2/academy-v2.js"
          grep -q 'BOOK_CATALOG' "$base/v2/academy-v2.js"
          grep -q 'CATALOG_ENDPOINT' "$base/v2/academy-v2.js"
          grep -q 'renderDiscover' "$base/v2/academy-v2.js"
          grep -q 'yamilet_academy_v2_warm' "$base/inicio/index.html"
          grep -q 'WARM_SESSION_KEY' "$base/v2/academy-v2.js"
          grep -q 'yamilet_academy_v2_next' "$base/gateway.js"

      - name: Block retired and obsolete runtime layers
        shell: bash
        run: |
          set -euo pipefail
          index='yamilet-perez-site-v2-verde-github/academia/index.html'
          ! grep -qE 'academy-appletv-v49|academy-dedicated-view-v51|academy-enrollment-v50|academia-yamilet-multipage-v40|academy-ag-parity-v20' "$index"
          ! grep -q 'academy-sales-admin.js' "$index"
          ! grep -q 'academy-assessment-review.js' "$index"
          ! grep -q 'academy-sales-admin.css' "$index"
          ! grep -q 'academy-assessment-review.css' "$index"
          ! grep -q 'characterData: true' yamilet-perez-site-v2-verde-github/academia/academy-aula-clone-v69.js

      - name: Validate linked local CSS and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          for page in "$base/index.html" "$base/catalogo.html" "$base/verificar.html"; do
            grep -oE '(src|href)="\./[^\"]+\.(js|css)(\?[^\"]*)?"' "$page" \
              | sed -E 's/^(src|href)="\.\/([^"?]+).*/\2/' \
              | sort -u \
              | while IFS= read -r asset; do
                  test -s "$base/$asset" || { echo "Missing linked asset in $page: $asset" >&2; exit 1; }
                  case "$asset" in *.js) node --check "$base/$asset" ;; esac
                done
          done

      - name: Validate lazy administrative assets
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          lazy=(
            content-admin-p15.js academy-content-cms-v80.js students-p16.js
            academy-assessment-admin.js academy-assessment-review-v83.js
            academy-certificate-admin-v84.js academy-agenda-admin-v85.js
            academy-support-runtime-v122.js academy-support-admin-v86.js academy-operations-admin-v87.js
            academy-settings-admin-v88.js
          )
          for asset in "${lazy[@]}"; do
            test -s "$base/$asset"
            node --check "$base/$asset"
          done

      - name: Guard public client boundary
        shell: bash
        run: |
          set -euo pipefail
          pattern='service[_-]?role|serviceRoleKey'
          ! grep -RniE "$pattern" yamilet-perez-site-v2-verde-github/academia --include='*.html' --include='*.js'

  deploy-academia:
    name: Deploy Academia to gh-pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: academia-yamilet-production
      cancel-in-progress: true
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1

      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 1

      - name: Sync Academia and original visual assets
        shell: bash
        run: |
          set -euo pipefail
          source_dir='source/yamilet-perez-site-v2-verde-github/academia/'
          public_dir='public/academia/'
          visual_source='source/imagenes-academia-yamilet-final/'
          visual_public='public/imagenes-academia-yamilet-final/'
          test -d "$source_dir"
          test -d "$visual_source"
          mkdir -p "$public_dir" "$visual_public"
          rsync -a --delete --exclude='.git/' "$source_dir" "$public_dir"
          rsync -a --delete "$visual_source" "$visual_public"
          install -D -m 0644 source/yamilet-perez-site-v2-verde-github/assets/logo-yamilet.png public/assets/logo-yamilet.png

      - name: Verify synchronized V2 gateway snapshot
        shell: bash
        run: |
          set -euo pipefail
          diff -qr source/yamilet-perez-site-v2-verde-github/academia public/academia
          diff -qr source/imagenes-academia-yamilet-final public/imagenes-academia-yamilet-final
          test -s public/academia/index.html
          test -s public/academia/gateway.js
          test -s public/academia/gateway.css
          test -s public/academia/inicio/index.html
          test -s public/academia/registro/index.html
          test -s public/academia/registro/registro.js
          test -s public/academia/cursos/index.html
          test -s public/academia/descubre/index.html
          test -s public/academia/biblioteca/index.html
          test -s public/academia/perfil/index.html
          test -s public/academia/sw.js
          test -s public/academia/manifest.webmanifest
          test -s public/assets/logo-yamilet.png
          grep -q 'name="academy-build" content="v143-registration-gateway"' public/academia/index.html
          grep -q 'gateway.js?v=143' public/academia/index.html
          grep -q '"start_url": "./inicio/"' public/academia/manifest.webmanifest
          grep -q "const BUILD = params.get('build') || '143'" public/academia/sw.js
          grep -q 'academy-v2.js?v=7' public/academia/inicio/index.html
          ! grep -q 'academy-admin.js' public/academia/index.html
          ! grep -q 'academy-dashboard.js' public/academia/index.html
          grep -q "location.replace('/admin/')" public/academia/admin/index.html

      - name: Guard deployment scope
        shell: bash
        run: |
          set -euo pipefail
          cd public
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(academia/|imagenes-academia-yamilet-final/|assets/logo-yamilet\.png$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Deployment attempted to change files outside the Academy scope:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A academia imagenes-academia-yamilet-final assets/logo-yamilet.png
          if git diff --cached --quiet; then
            echo "gh-pages already matches validated main; nothing to publish."
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          git commit -m "deploy(academia): sync ${short_sha}" -m "Validated source: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages