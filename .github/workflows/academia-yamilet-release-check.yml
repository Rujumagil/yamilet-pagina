name: Academia Yamilet release checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production JavaScript
        run: |
          node --check yamilet-perez-site-v2-verde-github/academia/app.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-shell-v21.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-player-v37.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-navigation.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-dashboard.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-courses.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-evaluations.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-library.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-calendar.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-certificates.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-profile.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-support.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-explore.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-admin.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-i18n-v27.js
          node --check yamilet-perez-site-v2-verde-github/academia/academy-i18n-preference-v27.js
          node --check yamilet-perez-site-v2-verde-github/academia/auth-email-p18.js
          node --check yamilet-perez-site-v2-verde-github/academia/private-media-p15.js
          node --check yamilet-perez-site-v2-verde-github/academia/drive-media-v26.js
          node --check yamilet-perez-site-v2-verde-github/academia/cloudflare-stream-v37.js
          node --check yamilet-perez-site-v2-verde-github/academia/recovery-p17.js

      - name: Validate architecture step 13 wiring
        run: |
          test -s yamilet-perez-site-v2-verde-github/academia/index.html
          test -s yamilet-perez-site-v2-verde-github/academia/styles.css
          test -s yamilet-perez-site-v2-verde-github/assets/logo-yamilet.png
          test -s yamilet-perez-site-v2-verde-github/academia/academy-admin.js
          test -s yamilet-perez-site-v2-verde-github/academia/academy-admin.css
          grep -q 'academia-yamilet-architecture-step-13' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './app.js?v=56' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-navigation.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-dashboard.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-courses.js?v=4' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-evaluations.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-library.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-calendar.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-certificates.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-profile.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-support.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-explore.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-admin.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-admin.css?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './academy-player-v37.js?v=38' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './auth-email-p18.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './private-media-p15.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './drive-media-v26.js?v=26' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './cloudflare-stream-v37.js?v=37' yamilet-perez-site-v2-verde-github/academia/index.html
          grep -q './recovery-p17.js?v=1' yamilet-perez-site-v2-verde-github/academia/index.html

      - name: Block obsolete runtime layers
        run: |
          ! grep -qE 'academy-appletv-v49|academy-dedicated-view-v51|academy-enrollment-v50|academia-yamilet-multipage-v40|academy-ag-parity-v20' yamilet-perez-site-v2-verde-github/academia/index.html

      - name: Validate linked local CSS and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          base='yamilet-perez-site-v2-verde-github/academia'
          index="$base/index.html"
          grep -oE '(src|href)="\./[^\"]+\.(js|css)(\?[^\"]*)?"' "$index" | sed -E 's/^(src|href)="\.\/([^"?]+).*/\2/' | sort -u | while IFS= read -r asset; do
            test -s "$base/$asset" || { echo "Missing or empty local asset referenced by index.html: $asset" >&2; exit 1; }
            case "$asset" in
              *.js) node --check "$base/$asset" ;;
            esac
          done
